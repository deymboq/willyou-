<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Over Anything 💍</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c20, #15102a, #060409);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #fff;
            position: relative;
        }

        /* Efek Hati Berjatuhan */
        .heart {
            position: absolute;
            color: rgba(255, 77, 109, 0.4);
            font-size: 20px;
            animation: fall linear infinite;
            z-index: 1;
        }
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* Layar Awal untuk Musik */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f0c20;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
        }
        .start-btn {
            background: linear-gradient(45deg, #ff4d6d, #8a2be2);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.6);
            animation: pulse 1.5s infinite;
        }

        /* Wadah Utama (Glassmorphism Premium) */
        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 28px;
            text-align: center;
            max-width: 440px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            display: none;
            transform: scale(0.8);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        .container.show { display: block; transform: scale(1); }

        /* Pengganti Image yang Error: Cincin / Couple Icon */
        .couple-icon-wrapper {
            width: 130px;
            height: 130px;
            margin: 0 auto 25px auto;
            background: rgba(255, 77, 109, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            border: 2px dashed rgba(255, 77, 109, 0.4);
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.2);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(45deg, #ff758f, #ffb3c6, #e0aaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        /* Surat Cinta / Propose Words */
        .proposal-text {
            font-size: 15px;
            line-height: 1.6;
            color: #d1d1e9;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 400;
        }
        .highlight {
            color: #ff4d6d;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.3);
        }

        #quote-text {
            font-size: 13.5px;
            color: #ff758f;
            font-weight: 500;
            min-height: 20px;
            margin-bottom: 20px;
            font-style: italic;
        }

        /* Tombol */
        .btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 60px;
            position: relative;
            margin-top: 10px;
        }
        button.action-btn {
            padding: 12px 32px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        #yesBtn {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
            box-shadow: 0 5px 20px rgba(255, 77, 109, 0.4);
            z-index: 10;
        }
        #noBtn {
            background-color: #221e38;
            color: #8c8ba5;
            position: absolute;
            left: 55%;
            border: 1px solid rgba(255,255,255,0.05);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 77, 109, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(255, 77, 109, 0.9); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 77, 109, 0.6); }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="doa.mp3" type="audio/mp3">
    </audio>

    <div id="overlay">
        <button class="start-btn" onclick="mulaiSurat()">Buka Surat dari Aku ✨</button>
    </div>

    <div class="container" id="mainCard">
        
        <div class="couple-icon-wrapper" id="mainIcon">💍</div>
        
        <h1 id="mainTitle">Dream Over Anything</h1>
        
        <div class="proposal-text" id="mainText">
            Di setiap detik kehidupanku, impian terbesar adalah membangun masa depan bersamamu. Hari ini, di hadapan semesta, aku ingin menaruh seluruh hatiku di tanganmu.<br><br>
            <span class="highlight">Selamat menunggu aku 2 tahun ya sayang...</span> Maukah kamu melangkah bersamaku dan menjadi istriku saat waktunya tiba?
        </div>
        
        <p id="quote-text"></p>
        
        <div class="btn-wrapper">
            <button id="yesBtn" class="action-btn" onclick="terimaLamaran()">Mau! 💍</button>
            <button id="noBtn" class="action-btn">Gak</button>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('overlay');
        const mainCard = document.getElementById('mainCard');
        const music = document.getElementById('bgMusic');
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const quoteText = document.getElementById('quote-text');
        const mainIcon = document.getElementById('mainIcon');

        // Quotes penolakan yang imut
        const quotes = [
            "Ehh, jangan menolak dong... Pikir-pikir dulu! 🥺",
            "Tombol 'Gak' lagi error, klik 'Mau!' aja mendingan 👉👈",
            "Jangan ditolak, 2 tahun ini bakal jadi bukti perjuangan kita! 🪐",
            "Duh, tega banget menolak orang se-cool aku? 😎",
            "Nggak ada opsi 'Gak' di kamus kita, klik tombol merah sekarang! ❤️",
            "I promise it will be worth the wait. Jadi, jangan ditolak ya? ✨"
        ];
        
        let quoteIndex = 0;
        let yesScale = 1;

        // Membuat Efek Hati Latar Belakang secara otomatis
        function createHearts() {
            const heartSymbols = ['❤️', '💖', '✨', '💕'];
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                    heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                    document.body.appendChild(heart);
                    
                    // Hapus hati setelah selesai animasi agar RAM tidak jebol
                    setTimeout(() => { heart.remove(); }, 6000);
                }, i * 300);
            }
        }

        // Jalankan Efek Hati Berkelanjutan
        setInterval(createHearts, 5000);

        function mulaiSurat() {
            createHearts();
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                mainCard.classList.add('show');
                music.play().catch(err => console.log("Musik butuh interaksi"));
            }, 500);
        }

        function aksiKabur(e) {
            e.preventDefault();
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40) + 20;
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            quoteText.innerText = quotes[quoteIndex];
            quoteIndex = (quoteIndex + 1) % quotes.length;

            yesScale += 0.25;
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        noBtn.addEventListener('mouseover', aksiKabur);
        noBtn.addEventListener('touchstart', aksiKabur);
        noBtn.addEventListener('click', aksiKabur);

        // Jika Diterima
        function terimaLamaran() {
            yesBtn.style.transform = "scale(1)";
            mainIcon.innerHTML = "👩‍❤️‍👨"; // Berubah jadi emoji couple bahagia
            mainIcon.style.background = "rgba(255, 77, 109, 0.2)";
            mainIcon.style.border = "2px solid #ff4d6d";
            
            document.getElementById('mainTitle').innerHTML = "YES! I DO! 👰‍♀️❤️🤵‍♂️";
            document.getElementById('mainText').innerHTML = `
                <span style="font-size: 18px; font-weight: bold; color: #ff758f;">Keputusan Terbaik dalam Hidupku!</span><br><br>
                Terima kasih sudah mau menerima perjuangan ini. Let's build our dream over anything together, my future wife! Aku berjanji waktu 2 tahun ini akan menjadi fondasi indah kita kelak. I love you! ✨💍
            `;
            
            quoteText.style.display = 'none';
            noBtn.style.display = 'none';
            yesBtn.style.display = 'none';
        }
    </script>
</body>
</html>
