<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Over Anything 💍</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c20, #15102a, #060409);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #fff;
            position: relative;
        }

        /* Efek Hati Berjatuhan */
        .heart {
            position: absolute;
            color: rgba(255, 77, 109, 0.4);
            font-size: 20px;
            animation: fall linear infinite;
            z-index: 1;
        }
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* Layar Awal untuk Musik */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f0c20;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
        }
        .start-btn {
            background: linear-gradient(45deg, #ff4d6d, #8a2be2);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.6);
            animation: pulse 1.5s infinite;
        }

        /* Wadah Utama (Glassmorphism Premium) */
        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 28px;
            text-align: center;
            max-width: 440px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            display: none;
            transform: scale(0.8);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        .container.show { display: block; transform: scale(1); }

        /* Foto Crush Terkunci (Tidak akan hilang) */
        .photo-wrapper {
            width: 140px;
            height: 140px;
            margin: 0 auto 25px auto;
            position: relative;
        }
        .crush-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff4d6d;
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.4);
            animation: float 3s ease-in-out infinite;
        }
        /* Mini Ring Badge di sudut foto */
        .ring-badge {
            position: absolute;
            bottom: 0;
            right: 5px;
            background: #15102a;
            border: 2px solid #ff4d6d;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(45deg, #ff758f, #ffb3c6, #e0aaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        /* Surat Propose Bahasa Inggris Romantis */
        .proposal-text {
            font-size: 14.5px;
            line-height: 1.6;
            color: #d1d1e9;
            margin-bottom: 25px;
            text-align: center;
        }
        .highlight {
            color: #ff4d6d;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.3);
        }

        #quote-text {
            font-size: 13px;
            color: #ff758f;
            font-weight: 500;
            min-height: 20px;
            margin-bottom: 20px;
            font-style: italic;
        }

        /* Tombol */
        .btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 60px;
            position: relative;
            margin-top: 10px;
        }
        button.action-btn {
            padding: 12px 32px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        #yesBtn {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
            box-shadow: 0 5px 20px rgba(255, 77, 109, 0.4);
            z-index: 10;
        }
        #noBtn {
            background-color: #221e38;
            color: #8c8ba5;
            position: absolute;
            left: 55%;
            border: 1px solid rgba(255,255,255,0.05);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 77, 109, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(255, 77, 109, 0.9); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 77, 109, 0.6); }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="doa.mp3" type="audio/mp3">
    </audio>

    <div id="overlay">
        <button class="start-btn" onclick="mulaiSurat()">Open Letter From Me ✨</button>
    </div>

    <div class="container" id="mainCard">
        
        <div class="photo-wrapper">
            <img src="crush.jpg" alt="My Beautiful Crush" class="crush-photo">
            <div class="ring-badge" id="subBadge">💍</div>
        </div>
        
        <h1 id="mainTitle">Dream Over Anything</h1>
        
        <div class="proposal-text" id="mainText">
            In every heartbeat, my ultimate dream is to build a beautiful forever with you. Today, I am putting my whole heart into your hands.<br><br>
            <span class="highlight">Please give me 2 years to make this dream come true...</span> Will you walk this journey with me and be my future wife when the time comes?
        </div>
        
        <p id="quote-text"></p>
        
        <div class="btn-wrapper">
            <button id="yesBtn" class="action-btn" onclick="terimaLamaran()">Yes, I Do! 💍</button>
            <button id="noBtn" class="action-btn">No</button>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('overlay');
        const mainCard = document.getElementById('mainCard');
        const music = document.getElementById('bgMusic');
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const quoteText = document.getElementById('quote-text');
        const subBadge = document.getElementById('subBadge');

        // Quotes penolakan bahasa Inggris yang imut & membujuk
        const quotes = [
            "Wait, please don't say no... Think about us! 🥺",
            "The 'No' button is currently out of service, try 'Yes'! 👉👈",
            "These 2 years will be the proof of my love. Don't reject it just yet 🪐",
            "Are you really going to say no to someone as cool as me? 😎",
            "There's no 'No' in our dictionary. Click the red button! ❤️",
            "I promise it will be worth the wait. Trust me ✨"
        ];
        
        let quoteIndex = 0;
        let yesScale = 1;

        // Membuat Efek Hati Latar Belakang
        function createHearts() {
            const heartSymbols = ['❤️', '💖', '✨', '💕'];
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                    heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                    document.body.appendChild(heart);
                    
                    setTimeout(() => { heart.remove(); }, 6000);
                }, i * 300);
            }
        }

        setInterval(createHearts, 5000);

        function mulaiSurat() {
            createHearts();
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                mainCard.classList.add('show');
                music.play().catch(err => console.log("Music needs interaction"));
            }, 500);
        }

        function aksiKabur(e) {
            e.preventDefault();
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40) + 20;
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            quoteText.innerText = quotes[quoteIndex];
            quoteIndex = (quoteIndex + 1) % quotes.length;

            yesScale += 0.25;
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        noBtn.addEventListener('mouseover', aksiKabur);
        noBtn.addEventListener('touchstart', aksiKabur);
        noBtn.addEventListener('click', aksiKabur);

        // Jika Diterima (Foto tetap ada, hanya teks & badge berubah)
        function terimaLamaran() {
            yesBtn.style.transform = "scale(1)";
            subBadge.innerHTML = "👩‍❤️‍👨"; // Badge kecil di sudut foto berubah jadi couple
            
            document.getElementById('mainTitle').innerHTML = "YES! IT'S A PROMISE! 👰‍♀️❤️🤵‍♂️";
            document.getElementById('mainText').innerHTML = `
                <span style="font-size: 18px; font-weight: bold; color: #ff758f;">The Best Decision Ever!</span><br><br>
                Thank you for choosing to trust my journey. Let's build our dream over anything together, my future wife! I promise these 2 years will be the most beautiful foundation for our future. I love you! ✨💍
            `;
            
            quoteText.style.display = 'none';
            noBtn.style.display = 'none';
            yesBtn.style.display = 'none';
        }
    </script>
</body>
</html>
